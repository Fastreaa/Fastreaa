<svg xmlns="http://www.w3.org/2000/svg" width="800" height="44" viewBox="0 0 800 44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pre { fill: #94A3B8; font-size: 19px; }
    .w { fill: #60A5FA; font-size: 19px; font-weight: 600; opacity: 0;
          animation: cycle 13.00s ease-in-out infinite; transform-box: fill-box; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(12px); }
      3.00% { opacity: 1; transform: translateY(0); }
      17.00% { opacity: 1; transform: translateY(0); }
      20.00% { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 0; transform: translateY(-12px); }
    }
  </style>
  
  <text x="400.0" y="28.65" text-anchor="middle" class="w" style="animation-delay:0.00s">Readable over clever</text>
  <text x="400.0" y="28.65" text-anchor="middle" class="w" style="animation-delay:2.60s">Validate everything</text>
  <text x="400.0" y="28.65" text-anchor="middle" class="w" style="animation-delay:5.20s">Least privilege by default</text>
  <text x="400.0" y="28.65" text-anchor="middle" class="w" style="animation-delay:7.80s">Automate the boring parts</text>
  <text x="400.0" y="28.65" text-anchor="middle" class="w" style="animation-delay:10.40s">Ship, measure, improve</text>
</svg>
