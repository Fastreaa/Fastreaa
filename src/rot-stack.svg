<svg xmlns="http://www.w3.org/2000/svg" width="800" height="44" viewBox="0 0 800 44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pre { fill: #94A3B8; font-size: 19px; }
    .w { fill: #60A5FA; font-size: 19px; font-weight: 600; opacity: 0;
          animation: cycle 12.60s ease-in-out infinite; transform-box: fill-box; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(12px); }
      2.14% { opacity: 1; transform: translateY(0); }
      12.14% { opacity: 1; transform: translateY(0); }
      14.29% { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 0; transform: translateY(-12px); }
    }
  </style>
  <text x="394.0" y="28.65" text-anchor="end" class="pre">Daily driver:</text>
  <text x="406.0" y="28.65" text-anchor="start" class="w" style="animation-delay:0.00s">Python</text>
  <text x="406.0" y="28.65" text-anchor="start" class="w" style="animation-delay:1.80s">SQL</text>
  <text x="406.0" y="28.65" text-anchor="start" class="w" style="animation-delay:3.60s">LLM APIs</text>
  <text x="406.0" y="28.65" text-anchor="start" class="w" style="animation-delay:5.40s">React</text>
  <text x="406.0" y="28.65" text-anchor="start" class="w" style="animation-delay:7.20s">Docker</text>
  <text x="406.0" y="28.65" text-anchor="start" class="w" style="animation-delay:9.00s">CERN ROOT</text>
