<svg xmlns="http://www.w3.org/2000/svg" width="800" height="36" viewBox="0 0 800 36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .pre { fill: #94A3B8; font-size: 15px; }
    .w { fill: #60A5FA; font-size: 15px; font-weight: 600; opacity: 0;
          animation: cycle 10.00s ease-in-out infinite; transform-box: fill-box; }
    @keyframes cycle {
      0% { opacity: 0; transform: translateY(12px); }
      3.00% { opacity: 1; transform: translateY(0); }
      17.00% { opacity: 1; transform: translateY(0); }
      20.00% { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 0; transform: translateY(-12px); }
    }
  </style>
